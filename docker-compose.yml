name: flyheal

services:
  flyheal:
    build: .
    image: flyheal:local
    init: true
    command: ["python", "-m", "flyheal.ui", "--host", "0.0.0.0", "--port", "${FLYHEAL_PORT:-8765}", "--no-open"]
    ports:
      - "127.0.0.1:${FLYHEAL_PORT:-8765}:${FLYHEAL_PORT:-8765}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${FLYHEAL_PORT:-8765}/api/runs', timeout=3).read()"]
    volumes:
      - ./results:/app/results
    stop_grace_period: 30s
